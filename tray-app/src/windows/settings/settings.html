<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
  <title>Prism Workspace — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="settings-container">
    <header class="settings-header">
      <h1 class="settings-title">Settings</h1>
      <div class="connection-status-indicator" id="connection-status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Disconnected</span>
      </div>
    </header>

    <!-- Tab Bar -->
    <nav class="tab-bar" role="tablist">
      <button class="tab-button is-active-state" data-tab="connection" role="tab" aria-selected="true">Connection</button>
      <button class="tab-button" data-tab="general" role="tab" aria-selected="false">General</button>
      <button class="tab-button" data-tab="logs" role="tab" aria-selected="false">Logs</button>
    </nav>

    <!-- Connection Tab -->
    <section class="tab-panel is-visible-state" id="tab-panel-connection" role="tabpanel">
      <div class="form-field">
        <label class="field-label" for="settings-backend-url">Backend URL</label>
        <input type="url" id="settings-backend-url" class="field-input" placeholder="wss://api.tools.rod.dev">
      </div>

      <div class="form-field">
        <label class="field-label" for="settings-secret">API Secret</label>
        <input type="password" id="settings-secret" class="field-input" placeholder="Enter API secret">
      </div>

      <!-- WSL Mode Toggle (Windows only) -->
      <div class="form-field" id="settings-wsl-mode-section" style="display:none">
        <label class="field-label">Run Agent On</label>
        <div class="run-mode-selector">
          <button type="button" class="run-mode-button is-active-state" id="settings-mode-native-button" data-mode="native">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            Windows
          </button>
          <button type="button" class="run-mode-button" id="settings-mode-wsl-button" data-mode="wsl">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            WSL2
          </button>
        </div>
      </div>

      <!-- WSL Distro Selection -->
      <div class="form-field" id="settings-wsl-distro-section" style="display:none">
        <label class="field-label" for="settings-wsl-distro-select">WSL Distro</label>
        <div class="distro-select-wrapper">
          <select id="settings-wsl-distro-select" class="field-input field-select">
            <option value="" disabled selected>Detecting distros…</option>
          </select>
          <button type="button" id="settings-refresh-distros-button" class="refresh-distros-button" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
        </div>
        <div class="wsl-node-status" id="settings-wsl-node-status" style="display:none">
          <span class="wsl-node-status-dot" id="settings-wsl-node-status-dot"></span>
          <span class="wsl-node-status-text" id="settings-wsl-node-status-text"></span>
        </div>
      </div>

      <div class="form-field">
        <label class="field-label">Workspace Folder</label>
        <div class="folder-field-wrapper">
          <input type="text" id="settings-workspace-path" class="field-input" placeholder="Select a directory…" readonly>
          <button type="button" id="settings-browse-button" class="browse-button">Browse…</button>
        </div>
        <!-- Translated Linux path in WSL mode -->
        <div class="wsl-translated-path" id="settings-wsl-translated-path" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
          <span id="settings-wsl-translated-path-text"></span>
        </div>
      </div>

      <div class="form-field">
        <label class="field-label" for="settings-agent-name">Machine Name</label>
        <input type="text" id="settings-agent-name" class="field-input" placeholder="e.g. my-laptop">
      </div>

      <div class="button-row">
        <button id="save-connection-button" class="action-button primary-action-button">Save & Reconnect</button>
        <button id="disconnect-button" class="action-button secondary-action-button">Disconnect</button>
      </div>
    </section>

    <!-- General Tab -->
    <section class="tab-panel" id="tab-panel-general" role="tabpanel">
      <div class="toggle-row">
        <div class="toggle-label-group">
          <span class="toggle-title">Open on Startup</span>
          <span class="toggle-description">Automatically start the connector when you log in</span>
        </div>
        <label class="switch-element">
          <input type="checkbox" id="auto-launch-toggle">
          <span class="switch-slider"></span>
        </label>
      </div>

      <div class="divider-line"></div>

      <div class="button-row">
        <button id="reset-config-button" class="action-button danger-action-button">Reset All Settings</button>
      </div>
    </section>

    <!-- Logs Tab -->
    <section class="tab-panel" id="tab-panel-logs" role="tabpanel">
      <div class="log-viewer-container" id="log-viewer-container">
        <pre class="log-output" id="log-output">No logs yet.</pre>
      </div>
      <div class="button-row">
        <button id="refresh-logs-button" class="action-button secondary-action-button">Refresh</button>
      </div>
    </section>
  </main>

  <script>
    const tabButtons = document.querySelectorAll(".tab-button");
    const tabPanels = document.querySelectorAll(".tab-panel");

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const targetTab = button.dataset.tab;
        tabButtons.forEach((tabButton) => {
          tabButton.classList.remove("is-active-state");
          tabButton.setAttribute("aria-selected", "false");
        });
        tabPanels.forEach((panel) => panel.classList.remove("is-visible-state"));
        button.classList.add("is-active-state");
        button.setAttribute("aria-selected", "true");
        document.getElementById(`tab-panel-${targetTab}`).classList.add("is-visible-state");

        // Auto-load logs when switching to the Logs tab
        if (targetTab === "logs") refreshLogOutput();
      });
    });

    const backendUrlInput = document.getElementById("settings-backend-url");
    const secretInput = document.getElementById("settings-secret");
    const workspacePathInput = document.getElementById("settings-workspace-path");
    const agentNameInput = document.getElementById("settings-agent-name");
    const browseButton = document.getElementById("settings-browse-button");
    const saveButton = document.getElementById("save-connection-button");
    const disconnectButton = document.getElementById("disconnect-button");
    const autoLaunchToggle = document.getElementById("auto-launch-toggle");
    const resetButton = document.getElementById("reset-config-button");
    const refreshLogsButton = document.getElementById("refresh-logs-button");
    const logOutput = document.getElementById("log-output");
    const statusDot = document.getElementById("status-dot");
    const statusLabel = document.getElementById("status-label");

    // WSL elements
    const settingsWslModeSection = document.getElementById("settings-wsl-mode-section");
    const settingsWslDistroSection = document.getElementById("settings-wsl-distro-section");
    const settingsModeNativeButton = document.getElementById("settings-mode-native-button");
    const settingsModeWslButton = document.getElementById("settings-mode-wsl-button");
    const settingsWslDistroSelect = document.getElementById("settings-wsl-distro-select");
    const settingsRefreshDistrosButton = document.getElementById("settings-refresh-distros-button");
    const settingsWslNodeStatus = document.getElementById("settings-wsl-node-status");
    const settingsWslNodeStatusDot = document.getElementById("settings-wsl-node-status-dot");
    const settingsWslNodeStatusText = document.getElementById("settings-wsl-node-status-text");
    const settingsWslTranslatedPath = document.getElementById("settings-wsl-translated-path");
    const settingsWslTranslatedPathText = document.getElementById("settings-wsl-translated-path-text");

    let settingsCurrentMode = "native";
    let settingsSelectedDistroHasNode = false;

    // ── WSL Path Translation ─────────────────────────────────

    function translateUncPathToLinux(windowsPath) {
      const normalizedPath = windowsPath.replace(/\//g, "\\");
      const wslUncPattern = /^\\\\(?:wsl\.localhost|wsl\$)\\([^\\]+)(.*)$/i;
      const matchResult = normalizedPath.match(wslUncPattern);
      if (matchResult) {
        const remainingPath = matchResult[2] || "";
        return remainingPath.replace(/\\/g, "/") || "/";
      }
      return null;
    }

    function updateSettingsTranslatedPath() {
      const windowsPath = workspacePathInput.value;
      if (settingsCurrentMode !== "wsl" || !windowsPath) {
        settingsWslTranslatedPath.style.display = "none";
        return;
      }
      const linuxPath = translateUncPathToLinux(windowsPath);
      if (linuxPath) {
        settingsWslTranslatedPathText.textContent = `Linux path: ${linuxPath}`;
        settingsWslTranslatedPath.style.display = "flex";
      } else {
        settingsWslTranslatedPathText.textContent = "Could not detect Linux path — using raw path";
        settingsWslTranslatedPath.style.display = "flex";
      }
    }

    // ── WSL Mode Toggle ──────────────────────────────────────

    function setSettingsMode(mode) {
      settingsCurrentMode = mode;
      settingsModeNativeButton.classList.toggle("is-active-state", mode === "native");
      settingsModeWslButton.classList.toggle("is-active-state", mode === "wsl");
      settingsWslDistroSection.style.display = mode === "wsl" ? "" : "none";

      // WSL: user types the Linux path directly (can't browse WSL from Windows)
      // Native: readonly field with Browse dialog
      const isWslMode = mode === "wsl";
      browseButton.style.display = isWslMode ? "none" : "";
      workspacePathInput.readOnly = !isWslMode;
      workspacePathInput.placeholder = isWslMode
        ? "/home/user/project"
        : "Select a directory…";

      if (isWslMode) {
        loadSettingsDistros();
      } else {
        settingsWslTranslatedPath.style.display = "none";
      }

      updateSettingsTranslatedPath();
    }

    settingsModeNativeButton.addEventListener("click", () => setSettingsMode("native"));
    settingsModeWslButton.addEventListener("click", () => setSettingsMode("wsl"));

    // ── WSL Distro Detection ─────────────────────────────────

    async function loadSettingsDistros() {
      settingsWslDistroSelect.innerHTML = '<option value="" disabled selected>Detecting distros…</option>';
      settingsWslNodeStatus.style.display = "none";
      settingsSelectedDistroHasNode = false;

      try {
        const distros = await window.prismAgent.detectWslDistros();
        const wsl2Distros = distros.filter((distro) => distro.version === 2);

        if (wsl2Distros.length === 0) {
          settingsWslDistroSelect.innerHTML = '<option value="" disabled selected>No WSL2 distros found</option>';
          return;
        }

        settingsWslDistroSelect.innerHTML = '<option value="" disabled>Select a distro…</option>';
        for (const distro of wsl2Distros) {
          const option = document.createElement("option");
          option.value = distro.name;
          const stateLabel = distro.state === "Running" ? "" : ` (${distro.state})`;
          const defaultLabel = distro.isDefault ? " ★" : "";
          option.textContent = `${distro.name}${stateLabel}${defaultLabel}`;
          settingsWslDistroSelect.appendChild(option);
        }
      } catch {
        settingsWslDistroSelect.innerHTML = '<option value="" disabled selected>Error detecting distros</option>';
      }
    }

    settingsWslDistroSelect.addEventListener("change", async () => {
      if (settingsWslDistroSelect.value) {
        await checkSettingsNodeAvailability(settingsWslDistroSelect.value);
      }
    });

    settingsRefreshDistrosButton.addEventListener("click", () => loadSettingsDistros());

    async function checkSettingsNodeAvailability(distroName) {
      settingsWslNodeStatus.style.display = "flex";
      settingsWslNodeStatusDot.className = "wsl-node-status-dot checking";
      settingsWslNodeStatusText.textContent = "Checking Node.js…";
      settingsSelectedDistroHasNode = false;

      try {
        const nodeVersion = await window.prismAgent.checkWslNode(distroName);
        if (nodeVersion) {
          settingsWslNodeStatusDot.className = "wsl-node-status-dot available";
          settingsWslNodeStatusText.textContent = `Node.js ${nodeVersion}`;
          settingsSelectedDistroHasNode = true;
        } else {
          settingsWslNodeStatusDot.className = "wsl-node-status-dot unavailable";
          settingsWslNodeStatusText.textContent = "Node.js not found — install it in this distro";
        }
      } catch {
        settingsWslNodeStatusDot.className = "wsl-node-status-dot unavailable";
        settingsWslNodeStatusText.textContent = "Could not check Node.js";
      }
    }

    // ── Load Configuration ───────────────────────────────────

    async function loadConfiguration() {
      const configuration = await window.prismAgent.getConfig();
      backendUrlInput.value = configuration.backendUrl || "";
      secretInput.value = configuration.secret || "";
      workspacePathInput.value = (configuration.workspaceRoots || [])[0] || "";
      agentNameInput.value = configuration.agentName || "";

      const isAutoLaunch = await window.prismAgent.getAutoLaunch();
      autoLaunchToggle.checked = isAutoLaunch;

      // Restore WSL mode
      if (configuration.wslDistro) {
        settingsCurrentMode = "wsl";
        settingsModeNativeButton.classList.remove("is-active-state");
        settingsModeWslButton.classList.add("is-active-state");
        settingsWslDistroSection.style.display = "";

        await loadSettingsDistros();
        settingsWslDistroSelect.value = configuration.wslDistro;
        if (settingsWslDistroSelect.value) {
          await checkSettingsNodeAvailability(configuration.wslDistro);
        }

        updateSettingsTranslatedPath();
      }

      await updateStatus();
    }

    async function updateStatus() {
      const status = await window.prismAgent.agentStatus();
      statusDot.className = `status-dot ${status.connectionStatus}`;
      const labelMap = { connected: "Connected", disconnected: "Disconnected", connecting: "Connecting…" };
      statusLabel.textContent = labelMap[status.connectionStatus] || "Unknown";

      const isDisconnected = status.connectionStatus === "disconnected";
      const isConnecting = status.connectionStatus === "connecting";

      disconnectButton.disabled = isDisconnected || isConnecting;
    }

    // ── WSL Auto-Detection ───────────────────────────────────

    async function initializeSettingsWslSupport() {
      try {
        const distros = await window.prismAgent.detectWslDistros();
        const hasWsl2 = distros.some((distro) => distro.version === 2);
        if (hasWsl2) {
          settingsWslModeSection.style.display = "";
        }
      } catch {
        // WSL not available
      }
    }

    initializeSettingsWslSupport();

    // ── Event Handlers ───────────────────────────────────────

    browseButton.addEventListener("click", async () => {
      const selectedPath = await window.prismAgent.openFolderDialog();
      if (selectedPath) {
        workspacePathInput.value = selectedPath;
        updateSettingsTranslatedPath();
      }
    });

    saveButton.addEventListener("click", async () => {
      saveButton.disabled = true;
      saveButton.textContent = "Saving…";

      const workspacePath = workspacePathInput.value.trim();
      const isWslMode = settingsCurrentMode === "wsl";

      const configurationUpdate = {
        backendUrl: backendUrlInput.value.trim(),
        secret: secretInput.value.trim(),
        workspaceRoots: [workspacePath],
        agentName: agentNameInput.value.trim(),
        wslDistro: isWslMode ? settingsWslDistroSelect.value : "",
        wslLinuxPaths: isWslMode ? [workspacePath] : [],
      };

      await window.prismAgent.setConfig(configurationUpdate);
      await window.prismAgent.agentRestart();
      saveButton.textContent = "Save & Reconnect";
      saveButton.disabled = false;
      setTimeout(updateStatus, 1000);
    });

    disconnectButton.addEventListener("click", async () => {
      await window.prismAgent.agentStop();
      setTimeout(updateStatus, 500);
    });

    autoLaunchToggle.addEventListener("change", async () => {
      await window.prismAgent.setAutoLaunch(autoLaunchToggle.checked);
    });

    resetButton.addEventListener("click", async () => {
      if (confirm("Reset all settings? The connector will disconnect and you will need to reconfigure.")) {
        await window.prismAgent.agentStop();
        await window.prismAgent.resetConfig();
        settingsCurrentMode = "native";
        settingsModeNativeButton.classList.add("is-active-state");
        settingsModeWslButton.classList.remove("is-active-state");
        settingsWslDistroSection.style.display = "none";
        settingsWslTranslatedPath.style.display = "none";
        await loadConfiguration();
      }
    });

    async function refreshLogOutput() {
      const logs = await window.prismAgent.getLogs();
      if (logs.length === 0) {
        logOutput.textContent = "No logs yet.";
        return;
      }
      const levelColors = { info: "#7aa2f7", success: "#9ece6a", warn: "#e0af68", error: "#f7768e", rpc: "#bb9af7" };
      logOutput.innerHTML = logs.map((entry) => {
        const time = entry.timestamp.slice(11, 23);
        const color = levelColors[entry.level] || "#a9b1d6";
        const escapedMessage = entry.message.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        return `<span style="color:#565f89">${time}</span> <span style="color:${color}">${entry.level.toUpperCase().padEnd(7)}</span> ${escapedMessage}`;
      }).join("\n");
      const logViewerContainer = document.getElementById("log-viewer-container");
      logViewerContainer.scrollTop = logViewerContainer.scrollHeight;
    }

    refreshLogsButton.addEventListener("click", refreshLogOutput);

    setInterval(updateStatus, 5000);
    loadConfiguration();
  </script>
</body>
</html>
